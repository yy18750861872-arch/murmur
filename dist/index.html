<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062d3a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Murmur：按场景收藏声音，留一点安静给自己。"><title>Murmur · 留一点安静给自己</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><a href="#home" class="brand">murmur</a><button id="addTop" class="round" aria-label="添加收藏">＋</button></header><main id="main"></main><aside id="mini" hidden></aside><nav aria-label="主导航"><button data-page="home">⌂<span>首页</span></button><button data-page="library">▤<span>声音库</span></button></nav></div><dialog id="add"><form id="addForm"><div class="sheet-head"><h2>留住喜欢的声音</h2><button type="button" data-close="add" aria-label="关闭">×</button></div><p>把散落在不同平台的声音，收进自己的空间。</p><label>声音名称<input name="title" required maxlength="80" placeholder="例如：深夜窗边的雨声"></label><label>原始链接<input name="url" type="url" required placeholder="https://…"></label><label>使用场景<select name="scene"><option>睡眠</option><option>专注</option><option>放松</option></select></label><p id="formError" role="alert"></p><button class="primary" type="submit">保存到声音库</button></form></dialog><dialog id="player"><div class="sheet-head"><span>YOUR QUIET SPACE</span><button data-close="player" aria-label="收起播放页">⌄</button></div><div class="player-orb"></div><h2 id="playerTitle"></h2><p id="playerStatus"></p><div id="controls"><label>音量<input id="volume" aria-label="音量" type="range" min="0" max="1" step="0.01" value="0.35"></label><button id="toggle" class="primary">播放</button><label>定时停止<select id="timer"><option value="0">持续播放</option><option value="5">5 分钟</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option></select></label><p id="timerStatus"></p></div><a id="external" class="primary" target="_blank" rel="noopener noreferrer" hidden>打开原平台 ↗</a><p class="note" id="playerNote"></p></dialog><div id="toast" role="status"></div><script src="app.js"></script><script src="import.js"></script></body></html>
