<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062d3a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Murmur：按场景收藏声音，留一点安静给自己。"><title>Murmur · 留一点安静给自己</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="accounts.css"></head><body><div class="app" hidden><header><a href="#home" class="brand">murmur</a><button id="addTop" class="round" aria-label="添加收藏">＋</button></header><main id="main"></main><aside id="mini" hidden></aside><nav aria-label="主导航"><button data-page="home">⌂<span>首页</span></button><button data-page="library">▤<span>声音库</span></button></nav></div><section id="authGate"><a class="brand" href="./">murmur</a><h1>回到自己的声音空间</h1><p>登录后，在不同设备间保存你的收藏和场景。</p><div class="auth-tabs" role="group" aria-label="登录或注册"><button type="button" class="active" data-auth-mode="login">登录</button><button type="button" data-auth-mode="signup">注册</button></div><form id="authForm"><label>邮箱<input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>密码<input id="authPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="至少 8 位"></label><p id="authMessage" role="status"></p><button class="primary" id="authSubmit" type="submit">登录</button></form><p class="auth-mode-note">每个账号独立保存收藏、场景与使用时长。新账号从零开始。</p></section><dialog id="add"><form id="addForm"><div class="sheet-head"><h2>留住喜欢的声音</h2><button type="button" data-close="add" aria-label="关闭">×</button></div><p>把散落在不同平台的声音，收进自己的空间。</p><label>声音名称<input name="title" required maxlength="80" placeholder="例如：深夜窗边的雨声"></label><label>原始链接<input name="url" type="url" required placeholder="https://…"></label><label>使用场景<select name="scene"><option>睡眠</option><option>专注</option><option>放松</option></select></label><p id="formError" role="alert"></p><button
